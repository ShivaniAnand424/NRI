<section
  class="section property-preview"
  id="property-preview"
  aria-labelledby="property-title"
>
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">Handpicked</p>
      <h2 id="property-title">Featured properties</h2>
      <p>
        A selection of properties and projects in and around Nagpur. Prices
        and availability are confirmed directly with our team.
      </p>
    </div>

    <div class="gallery-grid">
      <figure class="gallery-item">
        <img src="{{ url_for('static', filename='images/properties/property-1.jpg') }}"
             alt="Apartments property category" loading="lazy">
        <figcaption>Apartments</figcaption>
        <a class="button button-outline-dark" href="{{ url_for('property_layout') }}">Explore property options</a>
      </figure>

      <figure class="gallery-item">
        <img src="{{ url_for('static', filename='images/properties/property-2.jpg') }}"
             alt="Residential plots property category" loading="lazy">
        <figcaption>Residential Plots</figcaption>
        <a class="button button-outline-dark" href="{{ url_for('property_layout') }}">Explore property options</a>
      </figure>

      <figure class="gallery-item">
        <img src="{{ url_for('static', filename='images/properties/property-3.png') }}"
             alt="Farm plots property category" loading="lazy">
        <figcaption>Farm Plots</figcaption>
        <a class="button button-outline-dark" href="{{ url_for('property_layout') }}">Explore property options</a>
      </figure>

    </div>
  </div>
</section>
