<section
  class="section property-preview"
  id="property-preview"
  aria-labelledby="property-title"

      <h2 id="property-title">Featured properties</h2>

        A selection of properties and projects in and around Nagpur. Prices
        and availability are confirmed directly with our team.
      </p>
    </div>

    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="{{ url_for('static', filename='images/properties/property-1.jpg') }}"

           href="https://wa.me/{{ site.whatsapp_number }}?text={{ 'Hello NRIPMC, I would like details about the property 1.'|urlencode }}"
