<section
  class="section property-preview"
  id="property-preview"
  aria-labelledby="property-title"
>
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">Handpicked</p>
      <h2 id="property-title">Featured properties</h2>
      <p>
        A selection of properties and projects in and around Nagpur. Prices
        and availability are confirmed directly with our team.
      </p>
    </div>

    <div class="gallery-grid">
      {% for property in properties %}
        <figure class="gallery-item">
          <img
            src="{{ url_for('static', filename='images/properties/' ~ property.image) }}"
            alt="{{ property.alt or property.name }}"
            loading="lazy"
          >
          <figcaption>
            <strong>{{ property.name }}</strong>
            <span>{{ property.location }}</span>
            <small>{{ property.type }}</small>
          </figcaption>
          <a class="button button-outline-dark"
             href="https://wa.me/{{ site.whatsapp_number }}?text={{ ('Hello NRIPMC, I would like details about ' ~ property.name)|urlencode }}"
             target="_blank" rel="noopener">WhatsApp for details</a>
        </figure>
      {% endfor %}
    </div>
  </div>
</section>
