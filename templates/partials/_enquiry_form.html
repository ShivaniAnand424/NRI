<section class="section enquiry" id="enquiry" aria-labelledby="enquiry-title">
  <div class="container">
    <div class="enquiry-heading">
      <div>
        <p class="eyebrow">Your next step</p>
        <h2 id="enquiry-title">Tell us what is happening in Nagpur.</h2>
        <p>
          Share a little about your property-related requirement. The
          available support can be discussed with you.
        </p>
      </div>
    </div>

    {# Shows "Thank you" or the error, so visitors know whether it was sent #}
    {% include 'partials/_flash.html' %}

    <form
      class="enquiry-form"
      action="{{ url_for('submit_enquiry') }}"
      method="post"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-field">
        <label for="full-name">Your name</label>
        <input id="full-name" name="full_name" type="text" autocomplete="name" required>
      </div>

      <div class="form-field">
        <label for="contact">Email or phone</label>
        <input id="contact" name="contact" type="text" autocomplete="email" required>
      </div>

      <div class="form-field">
        <label for="property-location">Where is the property?</label>
        <input id="property-location" name="property_location" type="text" placeholder="Area, Nagpur">
      </div>

      <div class="form-field">
        <label for="service">What do you need help with?</label>
        <select id="service" name="service">
          <option value="">Choose a service</option>
          <option>Property management</option>
          <option>Buy &amp; sell assistance</option>
          <option>Rental coordination</option>
          <option>Documentation guidance</option>
          <option>Property visits</option>
          <option>Tenant coordination</option>
          <option>Site &amp; condition checks</option>
          <option>Something else</option>
        </select>
      </div>

      <div class="form-field form-field-message">
        <label for="requirement">What would you like to discuss?</label>
        <textarea id="requirement" name="requirement" rows="3" required></textarea>
      </div>

      <button class="button button-gold" type="submit">Send enquiry</button>
    </form>
  </div>
</section>
