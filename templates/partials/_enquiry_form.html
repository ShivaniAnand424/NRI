<section class="section enquiry" id="enquiry" aria-labelledby="enquiry-title">
    <div class="container">
      <div class="enquiry-heading">
        <div>
          <p class="eyebrow">Your next step</p>
          <h2 id="enquiry-title">Tell us what is happening in Nagpur.</h2>
          <p>
            Share a little about your property-related requirement. The
            available support can be discussed with you.
          </p>
        </div>
      </div>
   
      <form
        class="enquiry-form"
        action="{{ url_for('submit_enquiry') }}"
        method="post"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   
        <div class="form-field">
          <label for="full-name">Your name</label>
          <input
            id="full-name"
            name="full_name"
            type="text"
            autocomplete="name"
            required
          >
        </div>
   
        <div class="form-field">
          <label for="contact">Email or phone</label>
          <input
            id="contact"
            name="contact"
            type="text"
            autocomplete="email"
            required
          >
        </div>
   
        <div class="form-field form-field-message">
          <label for="requirement">What would you like to discuss?</label>
          <textarea
            id="requirement"
            name="requirement"
            rows="3"
            required
          ></textarea>
        </div>
   
        <button class="button button-gold" type="submit">Send enquiry</button>
      </form>
    </div>
  </section>
   
  <section class="final-cta" aria-label="Contact NRIPMC">
    <div class="container final-cta-inner">
      <div>
        <h2>Let’s begin with your requirements.</h2>
        <p>Share what you are looking for and discuss a suitable next step.</p>
      </div>
      <a class="button button-gold" href="#enquiry">Submit an enquiry</a>
    </div>
  </section>
